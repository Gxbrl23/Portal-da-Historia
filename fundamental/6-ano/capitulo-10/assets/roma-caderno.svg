<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1050" role="img" aria-label="Mapa mental Roma Imperial: sete temas históricos"><title>Roma Imperial — Caderno ilustrado</title><rect width="1600" height="1050" fill="#fef6dc"/><line x1="50" x2="1550" y1="36" y2="36" stroke="#b0d1e0" opacity=".55"/><line x1="50" x2="1550" y1="78" y2="78" stroke="#b0d1e0" opacity=".55"/><line x1="50" x2="1550" y1="120" y2="120" stroke="#b0d1e0" opacity=".55"/><line x1="50" x2="1550" y1="162" y2="162" stroke="#b0d1e0" opacity=".55"/><line x1="50" x2="1550" y1="204" y2="204" stroke="#b0d1e0" opacity=".55"/><line x1="50" x2="1550" y1="246" y2="246" stroke="#b0d1e0" opacity=".55"/><line x1="50" x2="1550" y1="288" y2="288" stroke="#b0d1e0" opacity=".55"/><line x1="50" x2="1550" y1="330" y2="330" stroke="#b0d1e0" opacity=".55"/><line x1="50" x2="1550" y1="372" y2="372" stroke="#b0d1e0" opacity=".55"/><line x1="50" x2="1550" y1="414" y2="414" stroke="#b0d1e0" opacity=".55"/><line x1="50" x2="1550" y1="456" y2="456" stroke="#b0d1e0" opacity=".55"/><line x1="50" x2="1550" y1="498" y2="498" stroke="#b0d1e0" opacity=".55"/><line x1="50" x2="1550" y1="540" y2="540" stroke="#b0d1e0" opacity=".55"/><line x1="50" x2="1550" y1="582" y2="582" stroke="#b0d1e0" opacity=".55"/><line x1="50" x2="1550" y1="624" y2="624" stroke="#b0d1e0" opacity=".55"/><line x1="50" x2="1550" y1="666" y2="666" stroke="#b0d1e0" opacity=".55"/><line x1="50" x2="1550" y1="708" y2="708" stroke="#b0d1e0" opacity=".55"/><line x1="50" x2="1550" y1="750" y2="750" stroke="#b0d1e0" opacity=".55"/><line x1="50" x2="1550" y1="792" y2="792" stroke="#b0d1e0" opacity=".55"/><line x1="50" x2="1550" y1="834" y2="834" stroke="#b0d1e0" opacity=".55"/><line x1="50" x2="1550" y1="876" y2="876" stroke="#b0d1e0" opacity=".55"/><line x1="50" x2="1550" y1="918" y2="918" stroke="#b0d1e0" opacity=".55"/><line x1="50" x2="1550" y1="960" y2="960" stroke="#b0d1e0" opacity=".55"/><line x1="50" x2="1550" y1="1002" y2="1002" stroke="#b0d1e0" opacity=".55"/><line x1="50" x2="1550" y1="1044" y2="1044" stroke="#b0d1e0" opacity=".55"/><line x1="105" x2="105" y1="10" y2="1040" stroke="#d88d8d" stroke-width="3"/><rect x="60" y="170" width="690" height="166" rx="23" fill="#fffdf8" stroke="#b64c79" stroke-width="4"/><rect x="75" y="151" width="370" height="50" rx="18" fill="#b64c79"/><text x="93" y="185" fill="#fff" font-size="26" font-weight="700">Fim da República</text><text x="83" y="240" font-size="22" fill="#263441">Guerras civis e disputas entre generais</text><text x="83" y="268" font-size="22" fill="#263441">enfraqueceram as instituições republicanas.</text><rect x="60" y="385" width="690" height="166" rx="23" fill="#fffdf8" stroke="#d59516" stroke-width="4"/><rect x="75" y="366" width="370" height="50" rx="18" fill="#d59516"/><text x="93" y="400" fill="#fff" font-size="26" font-weight="700">Augusto</text><text x="83" y="455" font-size="22" fill="#263441">Em 27 a.C., Otávio recebeu o título de Augusto e</text><text x="83" y="483" font-size="22" fill="#263441">consolidou o Principado.</text><rect x="60" y="600" width="690" height="166" rx="23" fill="#fffdf8" stroke="#42966b" stroke-width="4"/><rect x="75" y="581" width="370" height="50" rx="18" fill="#42966b"/><text x="93" y="615" fill="#fff" font-size="26" font-weight="700">Pax Romana</text><text x="83" y="670" font-size="22" fill="#263441">Período de relativa estabilidade, expansão de</text><text x="83" y="698" font-size="22" fill="#263441">redes comerciais e circulação cultural.</text><rect x="850" y="170" width="690" height="166" rx="23" fill="#fffdf8" stroke="#2679b1" stroke-width="4"/><rect x="865" y="151" width="370" height="50" rx="18" fill="#2679b1"/><text x="883" y="185" fill="#fff" font-size="26" font-weight="700">Sociedade e escravidão</text><text x="873" y="240" font-size="22" fill="#263441">Elites, plebeus, libertos e escravizados viviam</text><text x="873" y="268" font-size="22" fill="#263441">experiências muito desiguais.</text><rect x="850" y="385" width="690" height="166" rx="23" fill="#fffdf8" stroke="#9854ad" stroke-width="4"/><rect x="865" y="366" width="370" height="50" rx="18" fill="#9854ad"/><text x="883" y="400" fill="#fff" font-size="26" font-weight="700">Crise do século III</text><text x="873" y="455" font-size="22" fill="#263441">Conflitos políticos, pressões militares e</text><text x="873" y="483" font-size="22" fill="#263441">dificuldades econômicas atingiram o Império.</text><rect x="850" y="600" width="690" height="166" rx="23" fill="#fffdf8" stroke="#bf5947" stroke-width="4"/><rect x="865" y="581" width="370" height="50" rx="18" fill="#bf5947"/><text x="883" y="615" fill="#fff" font-size="26" font-weight="700">Divisão em 395</text><text x="873" y="670" font-size="22" fill="#263441">Após Teodósio I, Oriente e Ocidente passaram a</text><text x="873" y="698" font-size="22" fill="#263441">ter governos imperiais distintos.</text><rect x="455" y="815" width="690" height="166" rx="23" fill="#fffdf8" stroke="#347f93" stroke-width="4"/><rect x="470" y="796" width="370" height="50" rx="18" fill="#347f93"/><text x="488" y="830" fill="#fff" font-size="26" font-weight="700">Continuidade oriental</text><text x="478" y="885" font-size="22" fill="#263441">O Império Romano do Oriente permaneceu por séculos,</text><text x="478" y="913" font-size="22" fill="#263441">com capital em Constantinopla.</text><rect x="460" y="40" width="680" height="110" rx="40" fill="#284d79"/><text x="800" y="92" text-anchor="middle" font-size="50" font-weight="bold" fill="#fff" font-family="Georgia,serif">ROMA IMPERIAL</text><text x="800" y="126" text-anchor="middle" font-size="23" fill="#fff">MAPA MENTAL ILUSTRADO · 6º ANO</text><text x="800" y="1028" text-anchor="middle" font-size="19" fill="#354653">PORTAL DA HISTÓRIA · material didático</text></svg>